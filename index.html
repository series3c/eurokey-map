<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eurokey Finder CH</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>

<div id="status">Lade lokale Daten...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([46.8182, 8.2275], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const statusEl = document.getElementById('status');

  // Lädt die vorkompilierte data.json direkt aus dem Repository
  fetch('./data.json')
    .then(res => {
      if (!res.ok) throw new Error('data.json konnte nicht geladen werden.');
      return res.json();
    })
    .then(items => {
      items.forEach(el => {
        L.marker([el.lat, el.lon])
          .addTo(map)
          .bindPopup(`<b>${el.name}</b><br>${el.desc}<br><small>Typ: ${el.type}</small>`);
      });
      statusEl.innerText = `${items.length} Eurokey-Standorte geladen`;
    })
    .catch(err => {
      console.error(err);
      statusEl.innerText = 'Fehler beim Laden der Standorte.';
    });

  // Optionales GPS – Karte bleibt auch ohne Freigabe voll nutzbar
  map.locate({setView: true, maxZoom: 13});
  map.on('locationfound', (e) => {
    L.circleMarker(e.latlng, { radius: 7, color: '#0078FF', fillColor: '#0078FF', fillOpacity: 0.9 })
      .addTo(map)
      .bindPopup("Dein Standort");
  });
  map.on('locationerror', () => {
    // Bleibt standardmässig auf Schweizer Übersicht
  });
</script>
</body>
</html>
