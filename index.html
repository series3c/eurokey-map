<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eurokey Finder CH</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>

<div id="status">Lade Eurokey-Standorte...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Kartenansicht zentriert auf die Schweiz
  const map = L.map('map').setView([46.8182, 8.2275], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const statusEl = document.getElementById('status');

  // Overpass QL: Bounding Box Schweiz (Süd, West, Nord, Ost)
  const ql = '[out:json][timeout:25];(node["eurokey"="yes"](45.81,5.95,47.81,10.50);way["eurokey"="yes"](45.81,5.95,47.81,10.50););out center;';
  const apiUrl = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(ql);

  fetch(apiUrl)
    .then(res => {
      if (!res.ok) throw new Error('Status ' + res.status);
      return res.json();
    })
    .then(data => {
      let count = 0;
      (data.elements || []).forEach(el => {
        const lat = el.lat || (el.center && el.center.lat);
        const lon = el.lon || (el.center && el.center.lon);
        if (lat && lon) {
          count++;
          const tags = el.tags || {};
          const name = tags.name || (tags.amenity === 'toilets' ? 'Eurokey WC' : 'Eurokey-Anlage');
          const desc = tags.description || tags.operator || '';
          const typ = tags.amenity || tags.highway || 'Anlage';
          
          L.marker([lat, lon])
            .addTo(map)
            .bindPopup(`<b>${name}</b><br>${desc}<br><small>Typ: ${typ}</small>`);
        }
      });
      statusEl.innerText = `${count} Eurokey-Standorte geladen`;
    })
    .catch(err => {
      console.error(err);
      statusEl.innerText = 'Fehler beim Laden (API ausgelastet)';
    });

  // GPS optional abfragen (blockiert nichts, falls abgelehnt)
  map.locate({setView: true, maxZoom: 13});
  map.on('locationfound', (e) => {
    L.circleMarker(e.latlng, { radius: 7, color: '#0078FF', fillColor: '#0078FF', fillOpacity: 0.9 })
      .addTo(map)
      .bindPopup("Dein Standort");
  });
  map.on('locationerror', () => {
    // Falls blockiert: bleibt still auf Schweiz-Ansicht
  });
</script>
</body>
</html>
