<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Standard-Ansicht: Schweiz-Zentrum
  const map = L.map('map').setView([46.8182, 8.2275], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap-Mitwirkende'
  }).addTo(map);

  const statusEl = document.getElementById('status');

  // 1. Standorte unabhängig von GPS immer sofort laden
  const query = `
    [out:json][timeout:30];
    (
      node["eurokey"="yes"](45.81,5.95,47.81,10.50);
      way["eurokey"="yes"](45.81,5.95,47.81,10.50);
    );
    out center;
  `;

  fetch('https://overpass.osm.ch/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query)
  })
  .then(res => res.json())
  .then(data => {
    let count = 0;
    data.elements.forEach(el => {
      const lat = el.lat || (el.center && el.center.lat);
      const lon = el.lon || (el.center && el.center.lon);
      if (lat && lon) {
        count++;
        const name = el.tags.name || (el.tags.amenity === 'toilets' ? 'Eurokey WC' : 'Eurokey-Anlage');
        const desc = el.tags.description || el.tags.operator || '';
        L.marker([lat, lon])
          .addTo(map)
          .bindPopup(`<b>${name}</b><br>${desc}<br><small>Typ: ${el.tags.amenity || el.tags.highway || 'Unbekannt'}</small>`);
      }
    });
    statusEl.innerText = `${count} Eurokey-Standorte geladen`;
  })
  .catch(err => {
    statusEl.innerText = 'Fehler beim Laden der Daten.';
    console.error(err);
  });

  // 2. GPS nur als optionales Extra behandeln
  map.locate({setView: true, maxZoom: 14});
  
  map.on('locationfound', (e) => {
    L.circleMarker(e.latlng, { radius: 8, color: '#0078FF', fillColor: '#0078FF', fillOpacity: 0.8 })
      .addTo(map)
      .bindPopup("Dein Standort");
  });

  map.on('locationerror', () => {
    // Falls blockiert oder abgelehnt: Bleibt einfach auf Schweiz-Übersicht
    console.log("Standortzugriff nicht gewährt – Standardansicht bleibt aktiv.");
  });
</script>
