<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eurokey Finder CH</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100%; width: 100%; }
    #status {
      position: absolute; top: 10px; left: 50px; z-index: 1000;
      background: rgba(255, 255, 255, 0.9); padding: 8px 14px;
      border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 14px; font-weight: bold;
    }
  </style>
</head>
<body>

<div id="status">Lade Standorte...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([46.8182, 8.2275], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap-Mitwirkende'
  }).addTo(map);

  // Standortermittlung des Nutzers
  map.locate({setView: true, maxZoom: 14});
  map.on('locationfound', (e) => {
    L.circleMarker(e.latlng, { radius: 8, color: '#0078FF', fillColor: '#0078FF', fillOpacity: 0.8 })
      .addTo(map)
      .bindPopup("Dein Standort");
  });

  // Schweizer Overpass API
  const query = `
    [out:json][timeout:25];
    area["ISO3166-1"="CH"]->.ch;
    (
      node["eurokey"="yes"](area.ch);
      way["eurokey"="yes"](area.ch);
    );
    out center;
  `;

  const statusEl = document.getElementById('status');

  fetch('https://overpass.osm.ch/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query)
  })
  .then(res => res.json())
  .then(data => {
    let count = 0;
    data.elements.forEach(el => {
      const lat = el.lat || (el.center && el.center.lat);
      const lon = el.lon || (el.center && el.center.lon);
      if (lat && lon) {
        count++;
        const name = el.tags.name || (el.tags.amenity === 'toilets' ? 'WC' : 'Eurokey-Anlage');
        const desc = el.tags.description || el.tags.operator || '';
        L.marker([lat, lon])
          .addTo(map)
          .bindPopup(`<b>${name}</b><br>${desc}<br><small>Typ: ${el.tags.amenity || el.tags.highway || 'Unbekannt'}</small>`);
      }
    });
    statusEl.innerText = `${count} Eurokey-Standorte geladen`;
  })
  .catch(err => {
    statusEl.innerText = 'Fehler beim Laden der Daten.';
    console.error(err);
  });
</script>
</body>
</html>
